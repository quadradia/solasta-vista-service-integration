; SolastaVistaSync configuration. Copy to vista-sync.ini next to vista-sync.exe.
; Relative paths are relative to the folder that holds vista-sync.exe.

[Vista]
; Folder holding the Vista company tables (IPART.dbf). Only company SO is imported.
DataDir=C:\Vista\DB\SO
ItemTable=IPART.dbf
Source=VISTA
Company=SO
; Parts in these classes, or whose part number starts with these prefixes, are never sent.
SkipClasses=TEST
SkipSkuPrefixes=SHIP-

[Sync]
IntervalMinutes=60
; Wait after the service starts before the first sync (lets the network come up after boot).
StartupDelaySeconds=60
; Changed items are sent in one request per run; this only splits very large batches.
MaxItemsPerRequest=500
; Snapshot copy of IPART.dbf and the per-SKU state file (item-state.txt).
WorkDir=work

[Api]
; OAuth2 client credentials (Identity Server client "vista-import").
TokenUrl=https://identity.nuvol9.com/connect/token
ClientId=vista-import
Scope=solasta-api inventory.import
; post = client_id/client_secret in the form body; basic = HTTP Basic header
TokenAuth=post
; Preferred: DPAPI-encrypted secret made on this machine with
;   vista-sync.exe --protect-secret secret.txt client-secret.bin
ClientSecretDpapiFile=client-secret.bin
; Alternative: plain-text secret in a file only Administrators/SYSTEM can read.
;ClientSecretFile=client-secret.txt
; The import endpoint does not exist yet in the Solasta API; this is the planned route.
ImportUrl=https://api.mysolasta.com/api/inventory/import/items
; PEM file with the root CA certificate(s) of identity.nuvol9.com and api.mysolasta.com.
CaFile=ca-bundle.pem
TimeoutSeconds=120

[Log]
Dir=logs
RetentionDays=30
; 1 = also write warnings, errors and sync summaries to the Application event log
EventLog=1
